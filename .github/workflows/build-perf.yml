name: Build Performance

on:
  # Note! you can't safely use "pull_request_target" here
  # This workflow is mostly useful for "internal PRs"
  # External PRs won't be able to post a PR comment
  # See https://github.com/preactjs/compressed-size-action/issues/54
  # See https://securitylab.github.com/research/github-actions-preventing-pwn-requests
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - .github/workflows/build-perf.yml
      - package.json
      - bun.lock
      - packages/**
      - website/**
      - '!website/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Posts a PR comment with build size differences from PR vs main branches
  build-size:
    permissions:
      checks: write # for preactjs/compressed-size-action to create and update the checks
      contents: read # for actions/checkout to fetch code
      issues: write # for preactjs/compressed-size-action to create comments
      pull-requests: write # for preactjs/compressed-size-action to write a PR review
    # ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
    # This job can write to pull requests, issues and checks
    # See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
    cache-mode: none
    name: Build Size Report
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Track build size changes
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2.10.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Always rebuild packages, including for the base branch
          install-script: bash -c "bun install --frozen-lockfile --ignore-scripts && bun run build:packages"
          build-script: build:website:fast
          clean-script: clear:website # see https://github.com/facebook/docusaurus/pull/6838
          pattern: '{website/build/assets/js/main*js,website/build/assets/js/main*css,website/.docusaurus/globalData.json,website/.docusaurus/registry.js,website/.docusaurus/routes.js,website/.docusaurus/routesChunkNames.json,website/.docusaurus/site-metadata.json,website/.docusaurus/codeTranslations.json,website/.docusaurus/i18n.json,website/.docusaurus/docusaurus.config.mjs,website/build/index.html,website/build/docs.html,website/build/docs/**/*.html,website/build/blog.html,website/build/blog/**/*.html}'
          # HTML files: exclude versioned docs pages, tags pages, html redirect files
          exclude: '{website/build/docs/?.?.?/**/*.html,website/build/docs/next/**/*.html,website/build/blog/tags/**/*.html,**/*.html.html}'
          # Bun chunk hashes are 8 chars long
          strip-hash: '\.([^;]\w{7})\.'
          minimum-change-threshold: 30
          compression: none
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'

  # Ensures build times stay under reasonable thresholds
  build-time:
    name: Build Time Perf
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile

      # Ensure build with a cold cache does not increase too much
      - name: Build (cold cache)
        run: bun run build:website:fast
        timeout-minutes: 2
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'

      # Ensure build with a warm cache does not increase too much
      - name: Build (warm cache)
        run: bun run build:website:fast
        timeout-minutes: 1
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'

    # TODO post a GitHub comment with build with perf warnings?
