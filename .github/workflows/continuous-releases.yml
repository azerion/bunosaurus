name: Continuous Releases

on:
  push:
    branches:
      - main
      - docusaurus-v**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  release:
    name: Continuous Releases
    if: github.repository == 'facebook/docusaurus'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Installation
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Initialize fresh templates
        run: |
          bun ./packages/create-docusaurus/bin/index.js template/docusaurus-classic-js classic --javascript -p bun
          bun ./packages/create-docusaurus/bin/index.js template/docusaurus-classic-ts classic --typescript -p bun

      - name: Release
        run: bunx pkg-pr-new publish './packages/*' --template './template/*' --bun --packageManager=bun --compact --comment=off
