name: Lint AutoFix

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-autofix:
    name: Lint AutoFix
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Installation
        run: bun install --frozen-lockfile

      - name: AutoFix Formatting
        run: bun run format

      - name: AutoFix JS
        run: bun run lint:js:fix

      - name: AutoFix Style
        run: bun run lint:style:fix

      - name: AutoFix Spelling
        run: bun run lint:spelling:fix

      - name: AutoFix Dependency versions
        run: bun run lint:syncpack:fix

      - name: Print Diff
        run: git diff

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          commit_message: 'refactor: apply lint autofix'
