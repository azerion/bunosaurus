name: Lint

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Check immutable bun.lock
        run: git diff --exit-code

      - name: Add CSpell problem matcher
        run: echo "::add-matcher::.github/workflows/cspell-problem-matcher.json"

      # Independent read-only checks: run them concurrently
      # A failing check doesn't hide the results of the other ones
      # Keep in sync with the "lint" script of package.json
      # See https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/
      - parallel:
          - name: ESLint
            run: bun run lint:js --quiet
          - name: Stylelint
            run: bun run lint:style
          - name: Spelling
            run: bun run lint:spelling
          - name: Syncpack
            run: bun run lint:syncpack
          - name: Check bun.lock is up to date
            run: bun run lint:deps
          - name: Knip
            run: bun run lint:knip
          - name: Check Formatting
            run: bun run format:diff
