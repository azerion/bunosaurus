name: Publish

on:
  # Publish canary on push
  push:
    branches:
      - main
      - docusaurus-v**
    paths:
      - .github/workflows/publish.yml
      - package.json
      - packages/**

  # Publish release on manual dispatch
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'NPM Version - Including prerelease suffix (optional)'
        required: true
        default: 3.0.0-alpha.0
      npm_tag:
        type: choice
        description: 'NPM Dist Tag - Use `latest` for official stable releases'
        # default: canary
        required: true
        options:
          - canary
          - alpha
          - beta
          - rc
          - latest
          - v3-stable

permissions:
  id-token: write # For OIDC, see https://docs.npmjs.com/trusted-publishers
  contents: write # For GitHub tags

# ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
# A poisoned cache increases the chance of a compromised release being published
# See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

jobs:
  publish:
    name: Publish NPM release
    if: github.repository == 'azerion/bunosaurus'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Needed to get the commit number with "git rev-list --count HEAD"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Packages are packed with Bun, but published with the npm CLI: unlike
      # "bun publish", it supports npm trusted publishing (OIDC)
      - name: Set up Node (npm CLI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          #  ⚠️ Do not use any cache on purpose
          # It increases the chance of a compromised release being publish
          # See https://github.com/actions/setup-node/issues/1445#issuecomment-4040130833
          package-manager-cache: false
      - name: Prepare git
        run: |
          git config --global user.name "Docusaurus"
          git config --global user.email "github@docusaurus.io"
      - name: Installation
        run: bun install --frozen-lockfile

      - name: Publish Canary release
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.npm_tag == 'canary')
        run: |
          bun admin/scripts/release.ts version "$(bun admin/scripts/release.ts canary-version)"
          bun admin/scripts/release.ts publish --tag canary --client npm

      - name: Publish NPM release
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.npm_tag != 'canary'
        env:
          NPM_VERSION: ${{ github.event.inputs.npm_version }}
          NPM_TAG: ${{ github.event.inputs.npm_tag }}
        run: |
          bun admin/scripts/release.ts version "$NPM_VERSION"
          git commit --all --no-verify --message "v$NPM_VERSION"
          git tag "v$NPM_VERSION"
          bun admin/scripts/release.ts publish --tag "$NPM_TAG" --client npm
          git push origin "v$NPM_VERSION"

        # TODO should we push the package version local updates to Git?
        #  "main" is currently protected, even GitHub Actions can't push to it
        #  However it remains useful to push the git tag
