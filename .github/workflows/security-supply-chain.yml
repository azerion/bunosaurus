name: Security

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - docusaurus-v**
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check our monorepo for new supply chain compromissions
  supply-chain-monorepo:
    name: Supply Chain - Monorepo
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # See https://socket.dev/blog/introducing-socket-firewall
      # Bun isn't in the officially supported package managers list, but SFW
      # works as a network proxy that Bun goes through
      - name: Install Socket Firewall Free
        run: bun add --global sfw@2.0.6

      # Ensure our monorepo gets scanned by SFW
      - name: Install monorepo dependencies with SFW
        # No cache on purpose! We want SFW to fetch packages
        run: sfw bun install --frozen-lockfile --no-cache --minimum-release-age=0

  # Check our init template deps for new supply chain compromissions
  # This workflow is not ideal but good enough for now
  # See why https://github.com/facebook/docusaurus/pull/12448
  supply-chain-site-template:
    name: Supply Chain - Site Template @${{ matrix.npm_dist_tag }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # We check on various npm dist tags
        npm_dist_tag: ['latest', 'canary']

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # See https://socket.dev/blog/introducing-socket-firewall
      # Bun isn't in the officially supported package managers list, but SFW
      # works as a network proxy that Bun goes through
      - name: Install Socket Firewall Free
        run: bun add --global sfw@2.0.6

      # Generate the init template from a given npm dist tag
      - name: Generate published template
        # We want to use the freshest "create-docusaurus" initializer
        run: sfw bunx @azerion/create-bunosaurus@${{matrix.npm_dist_tag}} ../test-website classic --typescript --skip-install

      # Ensure no unexpected lifecycle (preinstall/postinstall scripts)
      # Bun doesn't run the lifecycle scripts of dependencies, unless they are
      # listed in trustedDependencies (or in Bun's default trusted list)
      - name: Install test-website project with SFW
        working-directory: ../test-website
        run: |
          # SFW should check the newest possible release + transitive deps
          sfw bun install --no-cache --minimum-release-age=0
          # Lists the dependency lifecycle scripts that Bun blocked
          bun pm untrusted
          bun run build
