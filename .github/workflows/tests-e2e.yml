name: E2E Tests

on:
  push:
    branches:
      - main
      - docusaurus-v**
    paths:
      - package.json
      - bun.lock
      - vitest.config.ts
      - test/**
      - packages/**
      - tsconfig.*.json
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - package.json
      - bun.lock
      - vitest.config.ts
      - test/**
      - packages/**
      - tsconfig.*.json
      - admin/verdaccio.yaml
      - admin/scripts/release.ts
      - admin/scripts/test-release.sh
      - admin/scripts/packForSite.ts
      - .github/workflows/tests-e2e.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # e2e tests running on Windows
  e2e-windows:
    name: E2E — Windows
    timeout-minutes: 30
    runs-on: windows-8-core
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Generate test-website project against main branch
        # Not using test-release.sh => no verdaccio docker image on Windows
        # The site uses the current packages through package.json overrides
        # pointing to packed tarballs. It is generated in runner.temp because
        # upload-artifact doesn't accept paths outside the workspace with ".."
        run: |
          bun ./packages/create-docusaurus/bin/index.js ${{ runner.temp }}/test-website classic --typescript --skip-install
          bun admin/scripts/packForSite.ts ${{ runner.temp }}/dist-packages ${{ runner.temp }}/test-website
      - name: Install test-website project
        run: bun install --ignore-scripts
        working-directory: ${{ runner.temp }}/test-website
      - name: Start test-website project
        run: bun run start --no-open
        working-directory: ${{ runner.temp }}/test-website
        env:
          E2E_TEST: true
      - name: Build test-website project
        # We build 2 locales to ensure a localized site doesn't leak memory
        # See https://github.com/facebook/docusaurus/issues/10944
        run: bun run build --locale en --locale fr
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
        working-directory: ${{ runner.temp }}/test-website
      # Upload build artifacts to ease Windows-specific troubleshooting
      - name: Upload website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-windows
          path: ${{ runner.temp }}/test-website/build
          if-no-files-found: error
      - name: TypeCheck website
        working-directory: ${{ runner.temp }}/test-website
        run: bun run typecheck

  bun:
    name: E2E — Bun (${{ matrix.variant }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [-s, -st]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Generate test-website project with ${{ matrix.variant }} against main branch
        run: bun run test:build:website ${{ matrix.variant }}
      - name: Install test-website project
        run: bun install
        working-directory: ../test-website
        env:
          BUN_CONFIG_REGISTRY: http://localhost:4873
      - name: TypeCheck website
        if: matrix.variant == '-st'
        working-directory: ../test-website
        run: bun run typecheck
      - name: TypeCheck website - min version - v6.0
        if: matrix.variant == '-st'
        working-directory: ../test-website
        run: |
          bun add -d --exact typescript@6.0
          bun run typecheck
      - name: TypeCheck website - max version - Latest
        if: matrix.variant == '-st'
        working-directory: ../test-website
        run: |
          bun add -d --exact typescript@latest
          bun run typecheck
      - name: Start test-website project
        run: bun run start --no-open
        working-directory: ../test-website
        env:
          E2E_TEST: true
      - name: Build test-website project
        # We build 2 locales to ensure a localized site doesn't leak memory
        # See https://github.com/facebook/docusaurus/issues/10944
        run: bun run build --locale en --locale fr
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
        working-directory: ../test-website

  # The site runs with Bun, but its dependencies can be installed with npm
  npm:
    name: E2E — npm install
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Generate test-website project against main branch
        run: bun run test:build:website -st
      - name: Install test-website project with npm
        run: npm install
        working-directory: ../test-website
        env:
          npm_config_registry: http://localhost:4873
      - name: TypeCheck website
        working-directory: ../test-website
        run: npm run typecheck
      - name: Start test-website project
        run: npm run start -- --no-open
        working-directory: ../test-website
        env:
          E2E_TEST: true
      - name: Build test-website project
        run: npm run build -- --locale en --locale fr
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
        working-directory: ../test-website
