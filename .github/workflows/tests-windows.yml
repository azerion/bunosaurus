name: Windows Tests

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - package.json
      - bun.lock
      - vitest.config.ts
      - test/**
      - packages/**
      - tsconfig.*.json
      - .github/workflows/tests-windows.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Tests
    timeout-minutes: 30
    runs-on: windows-8-core
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Docusaurus Tests
        run: bun run test
      - name: Create a deep path
        # https://github.com/facebook/docusaurus/pull/4899
        # https://github.com/facebook/docusaurus/issues/5793
        run: |
          mkdir -p "website/_dogfooding/_pages tests/deep-file-path-test/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar"
          cd "$_"
          echo "# hello" > test-file.md
      # Lightweight version of tests-swizzle.yml workflow, but for Windows
      - name: Swizzle Wrap TS
        run: bun run --filter website test:swizzle:wrap:ts
      - name: Docusaurus Build
        run: bun run build:website:fast
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'

      - name: TypeCheck website
        # see https://github.com/facebook/docusaurus/pull/10486
        run: bun run --filter website typecheck

      - name: TypeCheck website - min version - v6.0
        # We call the "typescript" package compiler explicitly, because the
        # root "tsc" bin comes from "@typescript/native" (pinned TS 7)
        run: |
          bun add -d --exact typescript@6.0 --ignore-scripts
          bun node_modules/typescript/bin/tsc --version
          bun node_modules/typescript/bin/tsc --project website/tsconfig.json

      - name: TypeCheck website - max version - Latest
        # For latest TS there are often lib check errors, so we disable it
        # Details: https://github.com/facebook/docusaurus/pull/10486
        run: |
          bun add -d --exact typescript@latest --ignore-scripts
          bun node_modules/typescript/bin/tsc --version
          bun node_modules/typescript/bin/tsc --project website/tsconfig.skipLibCheck.json
