name: Tests

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - package.json
      - bun.lock
      - vitest.config.ts
      - test/**
      - packages/**
      - tsconfig.*.json
      - .github/workflows/tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Remove Theme Internal Re-export
        run: bun run --filter @docusaurus/theme-common removeThemeInternalReexport
      - name: Docusaurus Build
        # We build 2 locales to ensure a localized site doesn't leak memory
        # See https://github.com/facebook/docusaurus/issues/10944
        run: bun run build:website:fast --locale en --locale fr
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
      - name: Docusaurus site CSS order
        run: bun run --filter website test:css-order

      - name: TypeCheck website
        # see https://github.com/facebook/docusaurus/pull/10486
        run: bun run --filter website typecheck

      - name: TypeCheck website - min version - v6.0
        # We call the "typescript" package compiler explicitly, because the
        # root "tsc" bin comes from "@typescript/native" (pinned TS 7)
        # bunx: "bun add" keeps node_modules/typescript linked to the root
        # "typescript" alias (@typescript/typescript6), which has no bin/tsc
        run: |
          bunx --package typescript@6.0 tsc --version
          bunx --package typescript@6.0 tsc --project website/tsconfig.json

      - name: TypeCheck website - max version - Latest
        # For latest TS there are often lib check errors, so we disable it
        # Details: https://github.com/facebook/docusaurus/pull/10486
        run: |
          bun add -d --exact typescript@latest --ignore-scripts
          bun node_modules/typescript/bin/tsc --version
          bun node_modules/typescript/bin/tsc --project website/tsconfig.skipLibCheck.json
